# Cyberdeck · phosphor
# Gerado por build.py a partir de flavors/palettes.json. Não edite.
set -g status-style "bg=#030604,fg=#c8f2d4"
set -g status-left "#[fg=#030604,bg=#39ff7a,bold] #S #[bg=#030604] "
set -g status-right "#[fg=#39ff7a,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#66866f,nobold]#h "
set -g window-status-format "#[fg=#66866f] #I:#W "
set -g window-status-current-format "#[fg=#ffb000,bold] #I:#W "
set -g pane-border-style "fg=#36553f"
set -g pane-active-border-style "fg=#39ff7a"
set -g message-style "bg=#030604,fg=#39ff7a"
set -g message-command-style "bg=#030604,fg=#39ff7a"
set -g mode-style "bg=#39ff7a,fg=#030604"
setw -g clock-mode-colour "#39ff7a"
