# Cyberdeck · synth
# Gerado por build.py a partir de flavors/palettes.json. Não edite.
set -g status-style "bg=#08030f,fg=#ebe1f7"
set -g status-left "#[fg=#08030f,bg=#ff3ea5,bold] #S #[bg=#08030f] "
set -g status-right "#[fg=#ff3ea5,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#8877aa,nobold]#h "
set -g window-status-format "#[fg=#8877aa] #I:#W "
set -g window-status-current-format "#[fg=#22e4ff,bold] #I:#W "
set -g pane-border-style "fg=#4f3d70"
set -g pane-active-border-style "fg=#ff3ea5"
set -g message-style "bg=#08030f,fg=#ff3ea5"
set -g message-command-style "bg=#08030f,fg=#ff3ea5"
set -g mode-style "bg=#ff3ea5,fg=#08030f"
setw -g clock-mode-colour "#ff3ea5"
