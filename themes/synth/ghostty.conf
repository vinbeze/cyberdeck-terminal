# Cyberdeck · synth — Neon de fliperama, magenta sobre violeta.
# Gerado por build.py a partir de flavors/palettes.json. Não edite.

background = #0d0618
foreground = #ebe1f7
cursor-color = #ff3ea5
cursor-text = #08030f
cursor-style = block
cursor-style-blink = true
selection-background = #ff3ea5
selection-foreground = #08030f
bold-color = #ff3ea5

palette = 0=#08030f
palette = 1=#ff4d6d
palette = 2=#3dffb0
palette = 3=#ffd23f
palette = 4=#6b8cff
palette = 5=#ff3ea5
palette = 6=#22e4ff
palette = 7=#ebe1f7
palette = 8=#8877aa
palette = 9=#ff7a91
palette = 10=#85ffcf
palette = 11=#ffe17a
palette = 12=#9cb2ff
palette = 13=#ff7cc3
palette = 14=#7aeeff
palette = 15=#ebe1f7

# Textura de CRT (grid + scanlines + vinheta)
background-image = __CYBERDECK_DIR__/crt-bg.png
background-image-opacity = 0.42
background-image-fit = cover
background-image-position = center

font-family = CaskaydiaMono Nerd Font Mono
font-size = 11
window-padding-x = 18
window-padding-y = 16
window-padding-balance = true
mouse-hide-while-typing = true
unfocused-split-opacity = 0.85
