# Cyberdeck · amber
# Gerado por build.py a partir de flavors/palettes.json. Não edite.
set -g status-style "bg=#060509,fg=#d6d6dc"
set -g status-left "#[fg=#060509,bg=#ffb000,bold] #S #[bg=#060509] "
set -g status-right "#[fg=#ffb000,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#7d808e,nobold]#h "
set -g window-status-format "#[fg=#7d808e] #I:#W "
set -g window-status-current-format "#[fg=#00c8b4,bold] #I:#W "
set -g pane-border-style "fg=#4a4d58"
set -g pane-active-border-style "fg=#ffb000"
set -g message-style "bg=#060509,fg=#ffb000"
set -g message-command-style "bg=#060509,fg=#ffb000"
set -g mode-style "bg=#ffb000,fg=#060509"
setw -g clock-mode-colour "#ffb000"
