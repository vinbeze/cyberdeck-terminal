# Cyberdeck · amber — Monitor âmbar, noite roxa (o original).
# Gerado por build.py a partir de flavors/palettes.json. Não edite.

background = #0a0810
foreground = #d6d6dc
cursor-color = #ffb000
cursor-text = #060509
cursor-style = block
cursor-style-blink = true
selection-background = #ffb000
selection-foreground = #060509
bold-color = #ffb000

palette = 0=#060509
palette = 1=#ff2e4d
palette = 2=#00c8b4
palette = 3=#ffb000
palette = 4=#4d8fe8
palette = 5=#d16bff
palette = 6=#00e0d0
palette = 7=#d6d6dc
palette = 8=#7d808e
palette = 9=#ff5c72
palette = 10=#2ee6c8
palette = 11=#ffc94a
palette = 12=#7ab2ff
palette = 13=#e08aff
palette = 14=#6df2ff
palette = 15=#d6d6dc

# Textura de CRT (grid + scanlines + vinheta)
background-image = __CYBERDECK_DIR__/crt-bg.png
background-image-opacity = 0.42
background-image-fit = cover
background-image-position = center

font-family = CaskaydiaMono Nerd Font Mono
font-size = 11
window-padding-x = 18
window-padding-y = 16
window-padding-balance = true
mouse-hide-while-typing = true
unfocused-split-opacity = 0.85
