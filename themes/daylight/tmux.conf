# Cyberdeck · daylight
# Gerado por build.py a partir de flavors/palettes.json. Não edite.
set -g status-style "bg=#e9e5da,fg=#1b1820"
set -g status-left "#[fg=#e9e5da,bg=#9a5800,bold] #S #[bg=#e9e5da] "
set -g status-right "#[fg=#9a5800,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#625c50,nobold]#h "
set -g window-status-format "#[fg=#625c50] #I:#W "
set -g window-status-current-format "#[fg=#00756a,bold] #I:#W "
set -g pane-border-style "fg=#a39b89"
set -g pane-active-border-style "fg=#9a5800"
set -g message-style "bg=#e9e5da,fg=#9a5800"
set -g message-command-style "bg=#e9e5da,fg=#9a5800"
set -g mode-style "bg=#9a5800,fg=#e9e5da"
setw -g clock-mode-colour "#9a5800"
